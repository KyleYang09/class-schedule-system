{% load assets %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}課表維護系統</title>
  <link rel="icon" href="{% asset 'schedule/img/icon-icons.ico' %}" sizes="any">
  <script>
    try {
      var saved = localStorage.getItem('schedule.theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% asset 'schedule/css/main.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'my_timetable' %}">課表維護系統</a>
      <nav class="nav" id="site-nav" aria-label="主選單">
        <a href="{% url 'my_timetable' %}"{% if nav == 'my' %} aria-current="page"{% endif %}>我的課表</a>
        <a href="{% url 'class_index' %}"{% if nav == 'class' %} aria-current="page"{% endif %}>班級課表</a>
        <a href="{% url 'teacher_index' %}"{% if nav == 'teacher' %} aria-current="page"{% endif %}>教師課表</a>
        <details class="nav-group">
          <summary{% if nav == 'han' or nav == 'hsin' or nav == 'hy' or nav == 'jai_chen' %} aria-current="page"{% endif %}>其他課表</summary>
          <div class="nav-group__menu">
            <a href="{% url 'py_han' %}"{% if nav == 'han' %} aria-current="page"{% endif %}>han的課表</a>
            <a href="{% url 'py_hsin' %}"{% if nav == 'hsin' %} aria-current="page"{% endif %}>hsin的課表</a>
            <a href="{% url 'py_hy' %}"{% if nav == 'hy' %} aria-current="page"{% endif %}>hy的課表</a>
            <a href="{% url 'jai_chen' %}"{% if nav == 'jai_chen' %} aria-current="page"{% endif %}>jia_chen的課表</a>
          </div>
        </details>
        <a class="nav__admin-link" href="{% url 'admin:index' %}">資料管理</a>
      </nav>
      <div class="header-tools">
        <a class="admin-link" href="{% url 'admin:index' %}">資料管理</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
          <span class="sr-only">深色模式</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="menu-toggle theme-toggle" id="menu-toggle" aria-label="開啟主選單" aria-controls="site-nav" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <line class="menu-icon__line menu-icon__line--top" x1="4" y1="6" x2="20" y2="6"/>
            <line class="menu-icon__line menu-icon__line--middle" x1="4" y1="12" x2="20" y2="12"/>
            <line class="menu-icon__line menu-icon__line--bottom" x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="{% asset 'schedule/js/theme.js' %}"></script>
  <script src="{% asset 'schedule/js/navigation.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
