{% load assets %}
{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}課表系統</title>
  <link rel="icon" href="{% static 'schedule/img/icon-icons.ico' %}" type="image/x-icon">
  <link rel="stylesheet" href="{% asset 'schedule/css/main.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'home' %}">課表維護系統</a>
      <nav class="nav" aria-label="主選單">
        <a href="{% url 'class_index' %}"{% if nav == 'class' %} aria-current="page"{% endif %}>班級課表</a>
        <a href="{% url 'teacher_index' %}"{% if nav == 'teacher' %} aria-current="page"{% endif %}>教師課表</a>
        <a href="{% url 'my_timetable' %}"{% if nav == 'my' %} aria-current="page"{% endif %}>我的課表</a>
      </nav>
      <a class="admin-link" href="{% url 'admin:index' %}">資料管理</a>
    </div>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
