{% extends 'schedule/base.html' %}
{% load assets %}
{% block title %}找不到頁面・{% endblock %}
{% block head %}
  <link rel="stylesheet" href="{% asset 'schedule/css/error.css' %}">
{% endblock %}
{% block content %}
<section class="lost" aria-labelledby="lost-title">
  <p class="lost__code" aria-hidden="true">404</p>
  <div class="lost__body">
    <h1 id="lost-title">找不到這個頁面</h1>
    <p>網址可能打錯了,或是這個班級、教師已經被移除。從下面回到課表,或用選單重新找一次。</p>
    <div class="lost__actions">
      <a class="btn" href="{% url 'my_timetable' %}">回到我的課表</a>
      <a class="btn btn--quiet" href="{% url 'class_index' %}">看班級課表</a>
      <a class="btn btn--quiet" href="{% url 'teacher_index' %}">看教師課表</a>
    </div>
  </div>
</section>
{% endblock %}
